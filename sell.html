<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing</title>
    <link rel="icon" href="icons/icon-512.png">
    <link rel="stylesheet" href="assets/css/sell.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
</head>
<body>
    <header class="navbar">
        <div class="left">
            <div class="logo"><a href="index.html"> <span> < </span> Create Listing</a></div>
        </div>
    </header>
    
    <div class="create-container">

        <h1>Sell something</h1>

        <form id="listingForm">
            <div id="toast"></div>
            <label for="image" class="upload-box">
                <span>📷 Upload Image</span>
            </label>
            <input type="file" id="image" name="image" accept="image/*" hidden required>

            <label>Title</label>
            <input type="text" id="title" required>

            <label>Description</label>
            <textarea id="description" required></textarea>

            <label>Price</label>
            <input type="number" id="price" required min="0" max="999999999">

            <label>Select Category</label>
            <div class="category-options">
                <button class="category-btn" data-category="Electronics" type="button">Electronics</button>
                <button class="category-btn" data-category="Books" type="button">Books</button>
                <button class="category-btn" data-category="Phones" type="button">Phones</button>
                <button class="category-btn" data-category="Laptops" type="button">Laptops</button>
                <button class="category-btn" data-category="Gadgets" type="button">Gadgets</button>
                <button class="category-btn" data-category="Fashion" type="button">Fashion</button>
                <button class="category-btn" data-category="Bags">Bags</button>
                <button class="category-btn" data-category="Shoes">Shoes</button>
                <button class="category-btn" data-category="Costmetics">Costmetics</button>
                <button class="category-btn" data-category="Jewelries">Jewelries</button>
                <button class="category-btn" data-category="Clothing" type="button">Clothing</button>
                <button class="category-btn" data-category="Food" type="button">Food</button>
                <button class="category-btn" data-category="Others" type="button">Others</button>
            </div>
            
            <div class="submit">
                <button type="submit" class="create-btn" id="sellBtn"> Create Listing</button>
            </div>
        </form>
    </div>
    <script src="assets/js/sell.js"></script>
    <script src="assets/js/pwa.js"></script>
</body>
</html>
